name: Windows CI

on:
  push:
  pull_request:

jobs:
  build:
    name: MSVC Vulkan build
    runs-on: windows-2022
    env:
      VULKAN_SDK_VERSION: 1.4.328.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK"
          $installer = Join-Path $env:RUNNER_TEMP "vulkan-sdk-$env:VULKAN_SDK_VERSION.exe"
          $downloadUrl = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan_sdk.exe?Human=true"

          if (Test-Path $sdkRoot) {
            Remove-Item -LiteralPath $sdkRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null

          if (-not (Test-Path $installer)) {
            curl.exe --fail-with-body -L -o $installer $downloadUrl
          }

          Write-Host "Installing Vulkan SDK $env:VULKAN_SDK_VERSION to $sdkRoot"
          $arguments = @(
            "--root", $sdkRoot,
            "--accept-licenses",
            "--default-answer",
            "--confirm-command",
            "install",
            "copy_only=1"
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Vulkan SDK installer failed with exit code $($process.ExitCode)."
          }

      - name: Locate Vulkan SDK for CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $preferredRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK"
          $searchRoots = @(
            $preferredRoot,
            $env:VULKAN_SDK,
            (Join-Path $env:GITHUB_WORKSPACE ".deps\VulkanSDK"),
            "C:\VulkanSDK\$env:VULKAN_SDK_VERSION",
            "C:\VulkanSDK"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          Write-Host "Search roots:"
          $searchRoots | ForEach-Object { Write-Host "  $_" }

          $sdkRoot = $null
          $candidateRoots = foreach ($root in $searchRoots) {
            $resolvedRoot = (Resolve-Path $root).Path
            $resolvedRoot
            Get-ChildItem -Path $resolvedRoot -Directory -Depth 2 -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
          }

          foreach ($root in ($candidateRoots | Select-Object -Unique)) {
            if (
              (Test-Path (Join-Path $root "Include\vulkan\vulkan.h")) -and
              (Test-Path (Join-Path $root "Bin\glslc.exe")) -and
              (Test-Path (Join-Path $root "Lib\vulkan-1.lib"))
            ) {
              $sdkRoot = $root
              break
            }
          }

          if (-not $sdkRoot) {
            Write-Host "Vulkan SDK directory tree diagnostics:"
            foreach ($root in $searchRoots) {
              Write-Host "Tree for $root"
              Get-ChildItem -Recurse -Depth 3 $root -ErrorAction SilentlyContinue | Select-Object FullName
            }
            throw "Vulkan SDK is installed or extracted incorrectly. Missing Include\vulkan\vulkan.h, Bin\glslc.exe, or Lib\vulkan-1.lib."
          }

          $includeDir = Join-Path $sdkRoot "Include"
          $library = Join-Path $sdkRoot "Lib\vulkan-1.lib"
          $glslc = Join-Path $sdkRoot "Bin\glslc.exe"

          "VULKAN_SDK=$sdkRoot" >> $env:GITHUB_ENV
          "Vulkan_ROOT=$sdkRoot" >> $env:GITHUB_ENV
          "Vulkan_INCLUDE_DIR=$includeDir" >> $env:GITHUB_ENV
          "Vulkan_LIBRARY=$library" >> $env:GITHUB_ENV
          "Vulkan_GLSLC_EXECUTABLE=$glslc" >> $env:GITHUB_ENV
          "$sdkRoot\Bin" >> $env:GITHUB_PATH

          Write-Host "VULKAN_SDK=$sdkRoot"
          Write-Host "Vulkan_INCLUDE_DIR=$includeDir"
          Write-Host "Vulkan_LIBRARY=$library"
          Write-Host "Vulkan_GLSLC_EXECUTABLE=$glslc"

      - name: Verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vsDevCmd = Join-Path $vsInstall "Common7\Tools\VsDevCmd.bat"
          cmd /c "call `"$vsDevCmd`" -arch=x64 -host_arch=x64 && cl"
          where.exe glslc
          glslc --version
          Test-Path "$env:VULKAN_SDK\Include\vulkan\vulkan.h"
          Test-Path "$env:VULKAN_SDK\Bin\glslc.exe"
          Test-Path "$env:VULKAN_SDK\Lib\vulkan-1.lib"

          if (
            -not (Test-Path "$env:VULKAN_SDK\Include\vulkan\vulkan.h") -or
            -not (Test-Path "$env:VULKAN_SDK\Bin\glslc.exe") -or
            -not (Test-Path "$env:VULKAN_SDK\Lib\vulkan-1.lib")
          ) {
            Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
            Get-ChildItem -Recurse -Depth 3 $env:VULKAN_SDK | Select-Object FullName
            throw "Vulkan SDK is installed or extracted incorrectly. Missing Include\vulkan\vulkan.h, Bin\glslc.exe, or Lib\vulkan-1.lib."
          }

      - name: Configure CMake
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DVULKAN_ENGINE_FETCH_DEPS=ON
          -DVulkan_INCLUDE_DIR="$env:VULKAN_SDK\Include"
          -DVulkan_LIBRARY="$env:VULKAN_SDK\Lib\vulkan-1.lib"
          -DVulkan_GLSLC_EXECUTABLE="$env:VULKAN_SDK\Bin\glslc.exe"

      - name: Compile GLSL shaders
        run: cmake --build build --config Debug --target VulkanEngineShaders --parallel

      - name: Build renderer
        run: cmake --build build --config Debug --target VulkanEngine --parallel

      # MSVC with /permissive- is the compiler most likely to catch a
      # portability bug that GCC and AppleClang accept, so it is worth building
      # and running the suite here and not only on Linux. The tests create no
      # Vulkan device, so no GPU is required on the runner.
      - name: Build tests
        run: cmake --build build --config Debug --target VulkanEngineTests --parallel

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure --no-tests=error
