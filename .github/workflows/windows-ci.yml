name: Windows CI

on:
  push:
  pull_request:

jobs:
  build:
    name: MSVC Vulkan build
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.328.1
          cache: true

      - name: Locate Vulkan SDK for CMake
        shell: pwsh
        run: |
          $searchRoots = @(
            $env:VULKAN_SDK,
            (Join-Path $env:GITHUB_WORKSPACE "VULKAN_SDK"),
            (Join-Path $env:RUNNER_TEMP "VULKAN_SDK"),
            "C:\VulkanSDK"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          Write-Host "Search roots:"
          $searchRoots | ForEach-Object { Write-Host "  $_" }

          $header = $null
          $library = $null
          $glslc = (Get-Command glslc.exe -ErrorAction SilentlyContinue).Source

          foreach ($root in $searchRoots) {
            if (-not $header) {
              $header = Get-ChildItem -Path $root -Recurse -Filter vulkan.h -File -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "[\\/]Include[\\/]vulkan[\\/]vulkan\.h$" } |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $library) {
              $library = Get-ChildItem -Path $root -Recurse -Filter vulkan-1.lib -File -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "[\\/]Lib[\\/]vulkan-1\.lib$" } |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $glslc) {
              $glslc = Get-ChildItem -Path $root -Recurse -Filter glslc.exe -File -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
            }
          }

          if (-not $header) {
            throw "Vulkan SDK install did not produce Include\vulkan\vulkan.h under the searched roots."
          }
          if (-not $library) {
            throw "Vulkan SDK install did not produce Lib\vulkan-1.lib under the searched roots."
          }
          if (-not $glslc) {
            throw "Vulkan SDK install did not produce glslc.exe under the searched roots or PATH."
          }

          $includeDir = Split-Path -Parent (Split-Path -Parent $header)
          $sdkRoot = Split-Path -Parent $includeDir
          $binDir = Split-Path -Parent $glslc

          "VULKAN_SDK=$sdkRoot" >> $env:GITHUB_ENV
          "Vulkan_ROOT=$sdkRoot" >> $env:GITHUB_ENV
          "Vulkan_INCLUDE_DIR=$includeDir" >> $env:GITHUB_ENV
          "Vulkan_LIBRARY=$library" >> $env:GITHUB_ENV
          "Vulkan_GLSLC_EXECUTABLE=$glslc" >> $env:GITHUB_ENV
          $binDir >> $env:GITHUB_PATH

          Write-Host "VULKAN_SDK=$sdkRoot"
          Write-Host "Vulkan_INCLUDE_DIR=$includeDir"
          Write-Host "Vulkan_LIBRARY=$library"
          Write-Host "Vulkan_GLSLC_EXECUTABLE=$glslc"

      - name: Verify toolchain
        shell: pwsh
        run: |
          cmake --version
          if (-not (Test-Path $env:Vulkan_INCLUDE_DIR)) { throw "Missing Vulkan include dir: $env:Vulkan_INCLUDE_DIR" }
          if (-not (Test-Path $env:Vulkan_LIBRARY)) { throw "Missing Vulkan library: $env:Vulkan_LIBRARY" }
          glslc --version

      - name: Configure CMake
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DVulkan_INCLUDE_DIR="$env:Vulkan_INCLUDE_DIR"
          -DVulkan_LIBRARY="$env:Vulkan_LIBRARY"
          -DVulkan_GLSLC_EXECUTABLE="$env:Vulkan_GLSLC_EXECUTABLE"

      - name: Compile GLSL shaders
        run: cmake --build build --config Debug --target VulkanEngineShaders --parallel

      - name: Build renderer
        run: cmake --build build --config Debug --target VulkanEngine --parallel
