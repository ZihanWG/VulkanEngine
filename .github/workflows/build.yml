name: Linux Build

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run it supersedes, which would
# otherwise hold runners for a result nobody will read. Runs on main are never
# cancelled, so every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast, dependency-free gate that runs alongside the build rather than behind
  # the Vulkan SDK install, so a formatting slip reports in under a minute.
  format:
    name: clang-format
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to the major the ubuntu-24.04 image ships. clang-format's output
      # drifts between majors, so a bare `clang-format` would start failing the
      # day the runner image moves on, against a tree nobody had touched.
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      # src/shaders is GLSL and has no C++ headers, so the extension list keeps
      # clang-format away from it without needing an exclude.
      - name: Check formatting
        run: |
          if ! find src tests tools \
              \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
              -print0 | xargs -0 clang-format-18 --dry-run -Werror; then
            echo "::error::Formatting does not match .clang-format. Fix it with: find src tests tools \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 | xargs -0 clang-format-18 -i"
            exit 1
          fi

  build:
    name: Ubuntu Vulkan build
    # Pinned so the LunarG package list codename (noble) is deterministic.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the Vulkan SDK (glslc, headers, loader)
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install build and windowing dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            libegl-dev \
            libibus-1.0-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            ninja-build \
            pkg-config \
            spirv-cross \
            wayland-protocols \
            xorg-dev

      - name: Verify Vulkan headers and shader compiler
        run: |
          cmake --version
          ninja --version
          test -f /usr/include/vulkan/vulkan.h || {
            echo "Vulkan headers are unavailable; the vulkan-sdk package did not install them." >&2
            exit 1
          }
          command -v glslc || {
            echo "glslc is unavailable; the vulkan-sdk package did not provide it." >&2
            exit 1
          }
          glslc --version

      - name: Configure CMake
        run: cmake --preset ci-debug -DVULKAN_ENGINE_FETCH_DEPS=ON

      - name: Compile GLSL shaders
        run: |
          if cmake --build --preset ci-debug-shaders --parallel; then
            exit 0
          fi
          echo "Shader target VulkanEngineShaders failed. Confirm glslc is installed and Vulkan shader sources compile." >&2
          exit 1

      - name: Build renderer
        run: cmake --build --preset ci-debug --parallel

      - name: Run unit tests
        run: ctest --preset ci-debug

      # Cheap, no GPU, and closes the one real hole in the CPU<->GLSL mirroring
      # discipline: every mirrored constant is commented at both ends but nothing
      # verified they were equal, and a mismatch neither fails the build nor trips
      # validation -- it silently addresses the wrong froxel.
      - name: Shader constant parity
        run: python3 tools/check_shader_constants.py

      # The other half of the same discipline. The constant checker compares
      # `const uint` values, which reflection cannot see at all -- the compiler
      # folds them away before they reach the SPIR-V. This one pins the
      # descriptor and push-constant INTERFACE of every module against a
      # committed golden, so a renumbered binding or a shifted push-constant
      # member cannot land without the matching C++ change being visible in the
      # same diff. Two designs that sound stronger were measured and rejected
      # first; tools/check_shader_interface.py says why.
      - name: Shader interface parity
        run: python3 tools/check_shader_interface.py --build-dir build/ci-debug

      # Save Settings writes whatever captureRuntimeSettings hands it, starting
      # from defaults, so a field missing there is reset on every save -- two
      # were, for as long as they existed. Both functions are Renderer members
      # no headless test can call; this reads their source instead.
      - name: Settings capture parity
        run: python3 tools/check_settings_capture.py

      # Report-only static analysis over our own sources. Deliberately
      # non-blocking: .clang-tidy sets no WarningsAsErrors, so this surfaces
      # findings in the log rather than gating the build. Read the log; do not
      # read a green check here as "clang-tidy is clean".
      #
      # The previous `|| find src -name '*.cpp' | xargs clang-tidy` fallback is
      # gone. It ran a second, slower analysis whenever the first one failed and
      # then reported *that* command's status, so a genuine run-clang-tidy
      # failure could be masked by the retry succeeding.
      #
      # On a pull request it analyses only the translation units the pull
      # request touched -- each changed src/ .cpp, and the .cpp beside each
      # changed header -- because the whole-tree pass was 9.4 of this job's
      # 16.3 minutes, for a step that gates nothing. A header's other includers
      # are not followed, so a finding that only shows through one of them waits
      # for the push to main, which still analyses the whole tree. The step
      # prints the list, so what was covered is never a guess.
      - name: Static analysis (clang-tidy, report-only)
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          sudo apt-get install -y --no-install-recommends clang-tidy
          if [ -z "$BASE_SHA" ]; then
            echo "Whole tree: not a pull request."
            run-clang-tidy -p build/ci-debug -quiet 'src/.*'
            exit $?
          fi

          # The checkout is a single merge commit; the base is fetched so the
          # diff is exactly what this pull request changes.
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          files=()
          while IFS= read -r path; do
            case "$path" in
              *.cpp) candidate="$path" ;;
              *.h | *.hpp) candidate="${path%.*}.cpp" ;;
              *) continue ;;
            esac
            if [ -f "$candidate" ]; then
              files+=("$candidate")
            fi
          done < <(git diff --name-only --diff-filter=d "$BASE_SHA" HEAD -- src | sort -u)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No src/ translation unit changed; nothing to analyse on this pull request."
            exit 0
          fi
          mapfile -t files < <(printf '%s\n' "${files[@]}" | sort -u)
          echo "Analysing ${#files[@]} changed translation unit(s):"
          printf '  %s\n' "${files[@]}"
          # run-clang-tidy takes regexes matched against compile_commands.json;
          # anchoring each at a path separator and at the end keeps foo.cpp from
          # also matching barfoo.cpp, and [.] matches only a literal dot.
          patterns=()
          for file in "${files[@]}"; do
            patterns+=("/${file//./[.]}\$")
          done
          run-clang-tidy -p build/ci-debug -quiet "${patterns[@]}"

      # Re-build and run the headless tests under AddressSanitizer +
      # UndefinedBehaviorSanitizer so memory/UB regressions fail CI.
      - name: Configure CMake (ASan/UBSan)
        run: cmake --preset ci-asan -DVULKAN_ENGINE_FETCH_DEPS=ON

      - name: Build tests (ASan/UBSan)
        run: cmake --build --preset ci-asan --parallel

      - name: Run unit tests (ASan/UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset ci-asan
