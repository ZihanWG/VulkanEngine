# Runs the renderer for real, on CPU, with the validation layer on, and fails if
# validation reports anything.
#
# The existing Linux and Windows jobs compile the renderer and run the headless
# unit tests; neither ever executes a frame. This one does, on Mesa's lavapipe
# software Vulkan driver under a virtual X server, so the swapchain and present
# path are the same ones a real run takes.
#
# Coverage notes, measured rather than assumed (see docs/headless_ci.md):
#   - lavapipe exposes drawIndirectCount, so this job exercises the compacted
#     per-cascade indirect-count shadow path that MoltenVK cannot run at all.
#   - lavapipe exposes no async compute queue, so ClusterBuild/LightCull stay on
#     the graphics queue here. The async path is NOT covered by this job.
name: Headless render

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Its own job, ahead of the render, because it needs nothing this workflow
  # installs and a wrong leg list should report in seconds rather than behind a
  # Vulkan SDK install and a Debug build. It reads the sweep's leg list out of
  # this file, so it lives here rather than beside the other Python checks.
  sweep-coverage:
    name: configuration sweep coverage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check what the sweep covers
        run: python3 tools/check_ci_settings_coverage.py

  headless-render:
    name: lavapipe render + validation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      VK_LOADER_DEBUG: warn
      # Frames to render. Ten is enough to get past first-frame resource setup
      # and into a steady loop; software rasterization makes each one expensive,
      # and this job gates on validation, not on convergence.
      RENDER_FRAMES: 30
      # Captured near the end of the run so TAA history and exposure have
      # settled. Determinism does not require a converged frame, but a converged
      # one exercises more of the pipeline.
      CAPTURE_FRAME: 30
      CAPTURE_PATH: artifacts/lavapipe_frame30.png
      GOLDEN_PATH: tests/golden/lavapipe_frame30.png
      DIFF_PATH: artifacts/lavapipe_frame30_diff.png
      # Frames per configuration-sweep leg. The sweep asserts the shape of the
      # frame graph, not convergence, so it needs only enough frames to clear
      # first-frame resource setup and reach the steady loop. The default leg
      # keeps its 30 because it also gates on pixels.
      SWEEP_FRAMES: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the Vulkan SDK (glslc, headers, loader, validation layers)
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install build, windowing, and software-rasterizer dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            libegl-dev \
            libibus-1.0-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            mesa-vulkan-drivers \
            ninja-build \
            pkg-config \
            wayland-protocols \
            xorg-dev \
            xvfb

      # The ICD filename is not stable across Mesa releases (lvp_icd.json on
      # Mesa 25.x, lvp_icd.<arch>.json on older packages), so discover it and
      # pin it. The runner ships eight other ICDs; an unpinned loader would
      # silently test a different driver than this job claims to.
      - name: Select the lavapipe ICD
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          if [ -z "$icd" ]; then
            echo "No lavapipe ICD found; mesa-vulkan-drivers did not ship one." >&2
            ls -la /usr/share/vulkan/icd.d/ >&2
            exit 1
          fi
          echo "lavapipe ICD: $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Record driver capabilities
        run: |
          xvfb-run -a vulkaninfo --summary 2>&1 | tee lavapipe-summary.txt | \
            grep -E "apiVersion|driverName|driverInfo|deviceName|deviceType" || true

      - name: Configure CMake
        run: cmake --preset ci-debug -DVULKAN_ENGINE_FETCH_DEPS=ON

      - name: Compile GLSL shaders
        run: cmake --build --preset ci-debug-shaders --parallel

      # Must be a Debug-config preset. CMakeLists gates
      # VULKAN_ENGINE_ENABLE_VALIDATION on $<CONFIG:Debug>, so a Release build
      # would compile the validation layer out and silently turn this job into a
      # much weaker smoke test that can never fail its own gate.
      - name: Build renderer
        run: cmake --build --preset ci-debug --parallel

      - name: Build the image comparison tool
        run: cmake --build --preset ci-debug --target compare_images --parallel

      # Before anything gates on synchronization validation being quiet, prove it
      # can speak. The self-test records two overlapping writes to one buffer
      # with no barrier between them and fails if the layer says nothing: a
      # sweep that ran with the setting silently ignored would report 29 clean
      # configurations and have checked the ordering in none of them.
      #
      # First, because a dead check makes every step below it meaningless, and
      # cheap, because it exits before building a scene or rendering a frame.
      - name: Prove synchronization validation is live
        run: |
          set +e
          timeout 300 xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./build/ci-debug/VulkanEngine --sync-validation-selftest \
            > syncval-selftest.log 2>&1
          status=$?
          cat syncval-selftest.log
          echo "=== self-test exit status: $status ==="

          if [ "$status" -eq 5 ]; then
            echo "::error::Synchronization validation reported nothing for a deliberate hazard. The sweep below would prove nothing."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::The synchronization validation self-test exited with status $status."
            exit 1
          fi

          grep -q "Sync validation self-test: HAZARD REPORTED" syncval-selftest.log || {
            echo "::error::No self-test verdict in the log; the run did not reach the probe."
            exit 1
          }

      # The gate. --fail-on-validation-error makes the engine exit 2 when the
      # validation layer reported any error, including during teardown; the log
      # is captured either way. `timeout` bounds a hang.
      - name: Render and gate on validation
        run: |
          set +e
          timeout 1500 xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./build/ci-debug/VulkanEngine \
              --deterministic \
              --exit-after-frames "$RENDER_FRAMES" \
              --capture-frame "$CAPTURE_FRAME" \
              --capture-output "$CAPTURE_PATH" \
              --fail-on-validation-error \
              --asset-load-stats \
            > headless-render.log 2>&1
          status=$?
          cat headless-render.log
          echo "=== engine exit status: $status ==="

          if [ "$status" -eq 124 ]; then
            echo "::error::The renderer hit the 1500s timeout instead of exiting after $RENDER_FRAMES frames."
            exit 1
          fi
          if [ "$status" -eq 2 ]; then
            echo "::error::The validation layer reported errors. See the [Error] lines above."
            exit 1
          fi
          if [ "$status" -eq 3 ]; then
            echo "::error::The requested frame capture was never written."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::The renderer exited with status $status before completing $RENDER_FRAMES frames."
            exit 1
          fi

          # Belt and braces: a zero exit with no frame evidence would mean the
          # run silently did nothing, which must not read as a pass.
          grep -q "Validation tally:" headless-render.log || {
            echo "::error::No validation tally in the log; the run did not reach a clean shutdown."
            exit 1
          }

      # The default configuration is one point in a large space, and until now it
      # was the only point anything ran. docs/render_graph.md said so out loud:
      # "a mismatch introduced in a configuration nothing runs will still go
      # unnoticed until someone runs it". This step runs them.
      #
      # It also runs with --sync-validation, which is the only thing that checks
      # the barriers the graph infers. The first run of it found four classes of
      # hazard on the default configuration alone, every one of them a barrier
      # naming a narrower pipeline stage than the command it was ordering -- all
      # legal calls, correct pixels, and invisible to every other gate here. The
      # sweep is where it belongs rather than on the pixel gate above: the
      # configurations are what vary the barriers, and a hazard reported here
      # names the configuration that produced it.
      #
      # The default configuration is a leg of its own for that reason -- the
      # pixel gate covers its image, and nothing covered its synchronization.
      #
      # What it gates on is the render graph's own backstop, not pixels. The
      # graph declares a frame's passes in one place and records them across nine
      # translation units, and nothing but the backstop compares the two. A pass
      # that is declared and then never recorded leaves the graph's barriers,
      # resource lifetimes and culling all describing work that did not happen --
      # and the validation layer sees nothing wrong, because every individual
      # Vulkan call is still legal. That is exactly what this found on its first
      # run, in two configurations, both invisible to every other gate here.
      #
      # A sequential loop rather than a job matrix, and the reason is cost. Per
      # leg the render is small: roughly 4.5 s of renderer init and 5 s for the
      # first frame on lavapipe, then cheaper ones. What is expensive is
      # everything above this step -- the LunarG SDK install, the apt
      # dependencies, the shader compile and the Debug build -- none of which a
      # leg changes. A matrix repeats all of that per leg and multiplies the
      # billable minutes by the leg count to buy wall-clock this job does not
      # need.
      #
      # Every leg runs even after one fails, so a red run names every broken
      # configuration instead of only the first.
      - name: Sweep the configuration matrix
        run: |
          mkdir -p artifacts/sweep

          # Legs are "name|arguments". A settings file is a delta against the
          # defaults (see config/ci/README.md); the VSM stage and the scene
          # presets take command-line flags because neither is a persisted
          # setting.
          cat > artifacts/sweep/legs.txt <<'LEGS'
          default|
          all-effects|--settings config/ci/all-effects.json
          volumetric-fog|--settings config/ci/volumetric-fog.json
          irradiance-probes|--settings config/ci/irradiance-probes.json
          gtao|--settings config/ci/gtao.json
          ssr-off|--settings config/ci/ssr-off.json
          exposure-manual|--settings config/ci/exposure-manual.json
          exposure-log-average|--settings config/ci/exposure-log-average.json
          taa-on|--settings config/ci/taa-on.json
          bloom-off|--settings config/ci/bloom-off.json
          bloom-legacy|--settings config/ci/bloom-legacy.json
          occlusion-off|--settings config/ci/occlusion-off.json
          two-phase-off|--settings config/ci/two-phase-off.json
          bindless-off|--settings config/ci/bindless-off.json
          clustered-off|--settings config/ci/clustered-off.json
          layered-cascades|--settings config/ci/layered-cascades.json
          backface-culling-off|--settings config/ci/backface-culling-off.json
          depth-prepass-off|--settings config/ci/depth-prepass-off.json
          frames-in-flight-1|--settings config/ci/frames-in-flight-1.json
          transient-aliasing|--settings config/ci/transient-aliasing.json
          render-scale-half|--settings config/ci/render-scale-half.json
          punctual-gpu-cull|--settings config/ci/punctual-gpu-cull.json
          gpu-culling-off|--settings config/ci/gpu-culling-off.json
          shadow-culling-off|--settings config/ci/shadow-culling-off.json
          async-compute-off|--settings config/ci/async-compute-off.json
          adaptive-occlusion-off|--settings config/ci/adaptive-occlusion-off.json
          dynamic-resolution|--settings config/ci/dynamic-resolution.json
          lod-off|--settings config/ci/lod-off.json
          cascade-cache-off|--settings config/ci/cascade-cache-off.json
          stable-cascade-fit|--settings config/ci/stable-cascade-fit.json
          taa-ghost-guards|--settings config/ci/taa-ghost-guards.json
          taa-history-plain|--settings config/ci/taa-history-plain.json
          gtao-full|--settings config/ci/gtao-full.json
          fog-temporal-off|--settings config/ci/fog-temporal-off.json
          tonemap-aces|--settings config/ci/tonemap-aces.json
          debug-views|--settings config/ci/debug-views.json
          punctual-shadows-off|--settings config/ci/punctual-shadows-off.json
          shader-hot-reload|--settings config/ci/shader-hot-reload.json
          vsm-mark|--vsm mark
          vsm-render|--vsm render
          vsm-shadows|--vsm shadows
          vsm-debug-views|--vsm shadows --settings config/ci/vsm-debug-views.json
          scene-sunlit|--scene sunlit
          scene-cornell|--scene cornell
          scene-occlusion|--scene occlusion
          cornell-with-gi|--scene cornell --settings config/ci/irradiance-probes.json
          LEGS

          summary=artifacts/sweep/summary.txt
          : > "$summary"

          while IFS='|' read -r name args; do
            [ -z "$name" ] && continue
            log="artifacts/sweep/$name.log"
            echo "=== $name ($args) ==="

            set +e
            # shellcheck disable=SC2086 -- $args is a deliberate argument list.
            timeout 600 xvfb-run -a --server-args="-screen 0 1280x720x24" ./build/ci-debug/VulkanEngine --deterministic --exit-after-frames "$SWEEP_FRAMES" --fail-on-validation-error --sync-validation $args > "$log" 2>&1
            status=$?
            set -e

            backstop=$(grep -o "Render graph backstop: .*" "$log" || true)
            # awk rather than a sed backreference: the frame count is a
            # positional field in a fixed phrase, so this needs no escape.
            frames=$(echo "$backstop" | awk '{ for (i = 1; i < NF; i++) if ($i == "over") print $(i + 1) }')
            clean=$(echo "$backstop" | grep -c "0 order violations, 0 unrecorded passes, 0 declaration issues" || true)

            verdict="ok"
            if [ "$status" -ne 0 ]; then
              verdict="FAILED (exit $status)"
            elif ! grep -q "Validation tally:" "$log"; then
              # A zero exit with no tally means the run never reached a clean
              # shutdown, which must not read as a pass.
              verdict="FAILED (no validation tally)"
            elif [ -z "$backstop" ]; then
              verdict="FAILED (no backstop line)"
            elif [ "${frames:-0}" -eq 0 ]; then
              # Zero counts over zero frames is what a run that rendered nothing
              # looks like, and it is otherwise indistinguishable from a clean
              # sweep.
              verdict="FAILED (ended no frames)"
            elif [ "$clean" -eq 0 ]; then
              verdict="FAILED (backstop)"
            fi

            echo "$name: $verdict" >> "$summary"

            if [ "$verdict" != "ok" ]; then
              echo "::error::Configuration '$name' $verdict"
              echo "${backstop:-<no backstop line>}"
              # The named findings the engine logs beside the summary line.
              # Without them a red run is a local-repro exercise in a
              # configuration nobody was running.
              grep -E "order violation:|unrecorded pass:|declaration issue:|execution order:" "$log" || true
              tail -n 15 "$log"
            fi
          done < artifacts/sweep/legs.txt

          echo ""
          echo "Configuration sweep, $SWEEP_FRAMES frames each:"
          cat "$summary"

          if grep -q FAILED "$summary"; then
            echo "::error::$(grep -c FAILED "$summary") configuration(s) failed. Per-leg logs"
            echo "::error::are in the headless-render-logs artifact under sweep/."
            exit 1
          fi

      # A one-unit channel tolerance, and the reason is measured rather than
      # assumed -- it also corrects an earlier claim in this file that zero
      # tolerance was measured.
      #
      # Commit 1e90f23 was rendered three times by this job with no change in
      # between: 0 pixels differing, then 433 differing, then 0 again. Every
      # differing pixel was off by exactly 1. The CPU-side logs of those runs are
      # byte-identical and llvmpipe reports the same version and vector width, so
      # the divergence is in rasterization, not in anything the engine decided.
      #
      # Tolerating 1 absorbs exactly that noise and gives up almost nothing: a
      # pixel now has to be off by 2 or more to count. The half-resolution SSR
      # change, the last real rendering change to pass through here, moved pixels
      # by up to 14 and would still fail this gate. The differing-pixel budget
      # stays at zero, so anything that clears the tolerance still goes red.
      - name: Compare against the golden image
        run: |
          set +e
          ./build/ci-debug/compare_images \
            "$CAPTURE_PATH" "$GOLDEN_PATH" \
            --channel-tolerance 1 \
            --max-differing-fraction 0 \
            --diff-output "$DIFF_PATH"
          status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 2 ]; then
            echo "::error::compare_images could not read the capture or the golden."
            exit 1
          fi

          echo "::error::The rendered frame no longer matches tests/golden/. Download the"
          echo "::error::headless-render-logs artifact: it holds the new capture and a"
          echo "::error::difference image marking every changed pixel."
          echo ""
          echo "If this change is intended -- or if the Mesa version on the runner moved,"
          echo "which re-renders the scene differently for reasons unrelated to this repo --"
          echo "re-baseline by replacing the golden with the captured PNG from the artifact."
          echo "Driver version in this run:"
          grep -E "driverInfo|deviceName" lavapipe-summary.txt || true
          exit 1

      - name: Upload render logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headless-render-logs
          path: |
            lavapipe-summary.txt
            headless-render.log
            artifacts/
          if-no-files-found: warn
