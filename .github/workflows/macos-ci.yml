name: macOS CI

# Pushes to main and pull requests, like the Linux workflow. A push to any
# branch used to trigger it as well, so every pull request built it twice;
# workflow_dispatch runs it on a branch that has no pull request yet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes, which would
# otherwise hold runners for a result nobody will read. Runs on main are never
# cancelled, so every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: AppleClang Vulkan build
    # Apple Silicon, the same architecture as the MoltenVK development machine.
    # The Linux and Windows legs cannot see an AppleClang or libc++ difference:
    # GCC and MSVC each ship their own standard library, and a header that one
    # of them includes transitively is exactly what libc++ does not.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # This job compiles and runs the headless tests, so it needs the Vulkan
      # headers, a loader to satisfy find_package(Vulkan), and glslc -- not
      # MoltenVK, which only a run of the renderer would load. Homebrew has all
      # three without the LunarG installer's download and unpack step.
      - name: Install the Vulkan headers, loader and shader compiler
        run: brew install ninja vulkan-headers vulkan-loader shaderc

      # FindVulkan reads VULKAN_SDK the way it does on a machine with the LunarG
      # SDK sourced, so the Homebrew prefix stands in for the SDK root. Pointing
      # CMAKE_PREFIX_PATH at the whole prefix instead would also let
      # find_package pick up whatever else the runner image has installed there.
      - name: Locate the Vulkan installation for CMake
        run: echo "VULKAN_SDK=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          cmake --version
          ninja --version
          c++ --version
          test -f "$VULKAN_SDK/include/vulkan/vulkan.h" || {
            echo "Vulkan headers are unavailable under $VULKAN_SDK." >&2
            exit 1
          }
          command -v glslc || {
            echo "glslc is unavailable; the shaderc formula did not provide it." >&2
            exit 1
          }
          glslc --version

      # Warnings are errors here, as on Windows, because the first-party build
      # is measured clean under AppleClang's -Wall -Wextra -Wpedantic. The two
      # warnings that first measurement found were both worth having: one was
      # a pass the render-graph reports named "Unknown". MSVC /W4 does not warn
      # about an unhandled enumerator, so this leg is the one that can.
      - name: Configure CMake
        run: cmake --preset ci-debug -DVULKAN_ENGINE_FETCH_DEPS=ON -DVULKAN_ENGINE_WARNINGS_AS_ERRORS=ON

      - name: Compile GLSL shaders
        run: cmake --build --preset ci-debug-shaders --parallel

      # `-k 0` keeps Ninja going past a failed translation unit. The breaks this
      # job exists to find are portability breaks, which tend to arrive several
      # at a time, and stopping at the first would report one per run.
      - name: Build renderer
        run: cmake --build --preset ci-debug --parallel -- -k 0

      # The tests create no Vulkan device, so they need no GPU. The renderer
      # itself is not run here: runtime evidence comes from a real Mac and from
      # the lavapipe job.
      - name: Run unit tests
        run: ctest --preset ci-debug

      - name: Shader constant parity
        run: python3 tools/check_shader_constants.py
